<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base platform layer -->
  <polygon points="24,34 42,24 42,29 24,39 6,29 6,24" fill="#0369a1" filter="url(#shadow)"/>
  <polygon points="24,32 42,22 24,12 6,22" fill="#0284c7" opacity="0.5"/>

  <!-- Core Sturdy Cube -->
  <!-- Top Face -->
  <polygon points="24,4 40,13 24,22 8,13" fill="url(#gradTop)" filter="url(#shadow)"/>
  <!-- Left Face -->
  <polygon points="8,13 24,22 24,35 8,26" fill="url(#gradLeft)"/>
  <!-- Right Face -->
  <polygon points="24,22 40,13 40,26 24,35" fill="url(#gradRight)"/>

  <!-- Subtle Node / K8s accent dots -->
  <circle cx="24" cy="13" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="16" cy="17.5" r="1.5" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="32" cy="17.5" r="1.5" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="24" cy="27" r="2" fill="#38bdf8"/>
</svg>
